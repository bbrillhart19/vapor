### Compose structure to coordinate Vapor and its dependencies ###

# Base services (shared configs)
# NOTE: Neo4j has shared configs as there is a default instance for prod
# with mounted volumes for persistence, and a dev instance for testing
# which should not persist its data and is mapped to different ports
x-neo4j: &neo4j
  image: neo4j:2025.05.0
  environment:
    - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PW}
    - NEO4J_apoc_export_file_enabled=true
    - NEO4J_apoc_import_file_enabled=true
    - NEO4J_apoc_import_file_use__neo4j__config=true
    - NEO4J_PLUGINS=["apoc"]
    - NEO4J_dbms_security_procedures_unrestricted="apoc.text.*"
  healthcheck:
    test: wget http://localhost:7474/browser -O -
    interval: 1m
    timeout: 2s
    retries: 5
    start_period: 30s
    start_interval: 5s

# NOTE: All services should have a profile:
# Purpose - one of [default, dev]
services:
  # Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_DOCKER_HOST_NAME}
    volumes:
      - ${VAPOR_DATA_PATH}/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - ${OLLAMA_PORT}:11434
    healthcheck:
      test: ollama list
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    profiles:
      - default

  # Neo4j GraphDB 
  neo4j:
    <<: *neo4j
    container_name: ${NEO4J_DOCKER_HOST_NAME}
    volumes:
      - ${VAPOR_DATA_PATH}/neo4j/logs:/logs
      - ${VAPOR_DATA_PATH}/neo4j/config:/config
      - ${VAPOR_DATA_PATH}/neo4j/data:/data
      - ${VAPOR_DATA_PATH}/neo4j/plugin:/plugins    
    ports:
      - ${NEO4J_BROWSER_PORT}:7474
      - ${NEO4J_BOLT_PORT}:7687
    restart: unless-stopped
    profiles:
      - default

  # Testing service only for neo4j (no volumes, different ports)
  neo4j-dev:
    <<: *neo4j
    container_name: neo4j-dev 
    ports:
      - 7475:7474
      - 7688:7687
    networks:
      - dev
    profiles:
      - dev

  # MCP Server
  mcp:
    image: vapor-mcp
    container_name: ${MCP_DOCKER_HOST_NAME}
    build:
      context: .
      dockerfile: ./dockerfiles/mcp.dockerfile
    volumes:
      - ./vapor/mcp_server:/app/vapor/mcp_server:ro
      - ./vapor/core:/app/vapor/core:ro
    env_file:
      - ./.env
    environment:
      - FASTMCP_HOST=0.0.0.0
    command: fastmcp run vapor/mcp_server/main.py --transport http
    ports:
      - ${MCP_PORT}:8000
    healthcheck:
      test: curl -f http://127.0.0.1:8000/health
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      neo4j: 
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles:
      - default

  # API layer
  app:
    image: vapor-app
    container_name: ${APP_DOCKER_HOST_NAME}
    build:
      context: .
      dockerfile: ./dockerfiles/app.dockerfile
    volumes:
      - ./vapor/app:/app/vapor/app:ro
      - ./vapor/core:/app/vapor/core:ro
      - ./.agents:/app/.agents:ro
    env_file:
      - ./.env
    command: fastapi run vapor/app/main.py
    ports:
      - ${APP_PORT}:8000
    healthcheck:
      test: curl -f http://127.0.0.1:8000/status/health
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    profiles:
      - default

  # Reflex (UI) services
  postgres:
    image: postgres
    container_name: ${REFLEX_PG_DOCKER_HOST_NAME}
    restart: always
    environment:
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
    profiles:
      - default

  redis:
    image: redis
    container_name: ${REFLEX_REDIS_DOCKER_HOST_NAME}
    ports:
      - ${REFLEX_REDIS_PORT}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    profiles:
      - default

  reflex:
    image: vapor-reflex
    container_name: ${REFLEX_BACKEND_DOCKER_HOST_NAME}
    build:
      dockerfile: ./dockerfiles/reflex-backend.dockerfile
      args:
        - REFLEX_REDIS_URL=redis://${REFLEX_REDIS_DOCKER_HOST_NAME}
    environment:
      - REFLEX_DB_URL=postgresql+psycopg://postgres:secret@${REFLEX_PG_DOCKER_HOST_NAME}/postgres
      - VAPOR_API_HOST=${APP_DOCKER_HOST_NAME}
    ports:
     - ${REFLEX_BACKEND_PORT}:8000
    depends_on:
      - postgres
      - redis
      - app
    volumes:
      - db-data:/app/data
      - upload-data:/app/uploaded_files
    restart: unless-stopped
    profiles:
      - default

  webserver:
    image: vapor-webserver
    container_name: ${REFLEX_WEB_DOCKER_HOST_NAME}
    build:
      context: .
      dockerfile: ./dockerfiles/webserver.dockerfile
      args:
        - REFLEX_API_URL=http://localhost:${REFLEX_BACKEND_PORT}
    volumes:
      - ./reflex-ui/nginx.conf.template:/etc/nginx/templates/default.conf.template
    env_file:
      - ./.env
    ports:
      - ${REFLEX_WEB_PORT}:80
    depends_on:
      - reflex
    profiles:
      - default
  
networks:
  dev:

volumes:
  # SQLite data
  db-data:
  # Uploaded files
  upload-data:
  # Postgres
  postgres-data:
